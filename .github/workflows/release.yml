name: Release

# Cutting a release: bump the version in CMakeLists.txt, move the CHANGELOG
# [Unreleased] entries under the new version, commit, then push a matching tag:
#
#   git tag v0.2.0 && git push origin v0.2.0
#
# The tag builds the x64 Release, packages a portable ZIP (executable + Slint
# runtime DLL) and publishes it to a GitHub Release whose body is the matching
# CHANGELOG section.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    name: package-windows-x64
    runs-on: windows-latest
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@v4

      - name: Set up MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache dependencies (Slint source + cargo)
        uses: actions/cache@v4
        with:
          path: |
            .deps-cache
            ~/.cargo/registry
            ~/.cargo/git
          key: slint-msvc-x64-release-${{ hashFiles('CMake/FetchSlint.cmake') }}-${{ github.sha }}
          restore-keys: |
            slint-msvc-x64-release-${{ hashFiles('CMake/FetchSlint.cmake') }}-
            slint-msvc-x64-

      - name: Configure
        run: cmake --preset x64-release

      - name: Build
        run: cmake --build --preset x64-release --parallel

      - name: Test
        run: ctest --preset x64-release --output-on-failure

      # Runs CPack; writes build/x64-release/cpp-slint-boilerplate-<ver>-windows-x64.zip
      - name: Package (CPack ZIP)
        run: cmake --build --preset x64-release --target package

      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: cpp-slint-boilerplate-windows-x64
          path: build/x64-release/*.zip
          if-no-files-found: error

      # Pull the section for this tag out of CHANGELOG.md to use as release notes.
      - name: Extract changelog for this version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v ver="$version" '
            found && substr($0, 1, 4) == "## [" { exit }
            substr($0, 1, 5 + length(ver)) == "## [" ver "]" { found = 1; next }
            found { print }
          ' CHANGELOG.md > release_notes.md
          if [ ! -s release_notes.md ]; then
            echo "See [CHANGELOG.md](CHANGELOG.md) for details." > release_notes.md
          fi

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: build/x64-release/*.zip
          body_path: release_notes.md
          generate_release_notes: false
