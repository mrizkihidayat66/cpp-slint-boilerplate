name: CI

on:
  push:
    branches: [main, examples/simple, examples/intermediate]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  format:
    name: clang-format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install clang-format
        run: pip install "clang-format==18.1.8"
      - name: Check formatting
        run: |
          find src tests -name '*.h' -o -name '*.cpp' \
            | xargs clang-format --dry-run --Werror

  build:
    name: ${{ matrix.arch }}-${{ matrix.build_type }}
    runs-on: windows-latest
    needs: format
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        arch: [x64, x86]
        build_type: [debug, release]

    steps:
      - uses: actions/checkout@v4

      # Activate the MSVC toolchain. Without this, CMake on windows-latest
      # finds MinGW (C:/mingw64/bin) first: x64 then links a C++/Rust ABI
      # mismatch into the app, and x86 links a 32-bit Rust/MSVC slint_cpp.dll
      # with the 64-bit MinGW linker. See docs/BUILDING_SLINT.md.
      - name: Set up MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: ${{ matrix.arch }}

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.arch == 'x86' && 'i686-pc-windows-msvc' || 'x86_64-pc-windows-msvc' }}

      - name: Cache dependencies (Slint source + cargo)
        uses: actions/cache@v4
        with:
          path: |
            .deps-cache
            ~/.cargo/registry
            ~/.cargo/git
          # "msvc" is part of the key so caches built by an older MinGW
          # toolchain are never reused (the Slint binaries are not portable
          # across C++ toolchains).
          key: slint-msvc-${{ matrix.arch }}-${{ hashFiles('CMake/FetchSlint.cmake') }}-${{ github.sha }}
          restore-keys: |
            slint-msvc-${{ matrix.arch }}-${{ hashFiles('CMake/FetchSlint.cmake') }}-
            slint-msvc-${{ matrix.arch }}-

      - name: Configure
        run: cmake --preset ${{ matrix.arch }}-${{ matrix.build_type }}

      - name: Build
        run: cmake --build --preset ${{ matrix.arch }}-${{ matrix.build_type }} --parallel

      - name: Test
        run: ctest --preset ${{ matrix.arch }}-${{ matrix.build_type }} --output-on-failure

      # SLINT_BACKEND=winit-software needs the software renderer compiled in
      # (SLINT_FEATURE_RENDERER_SOFTWARE=ON, the default in FetchSlint.cmake).
      # The runner has no GPU: femtovg would abort with 0xC0000409 here.
      - name: Smoke run (software renderer, GPU-less runner)
        shell: pwsh
        run: |
          $exe = "build/${{ matrix.arch }}-${{ matrix.build_type }}/slint-boilerplate.exe"
          $log = "smoke-${{ matrix.arch }}-${{ matrix.build_type }}.log"
          $env:SLINT_BACKEND = "winit-software"
          try {
            $proc = Start-Process -FilePath $exe -PassThru -RedirectStandardOutput $log -RedirectStandardError "$log.err"
            Start-Sleep -Seconds 5
            if ($proc.HasExited) {
              Get-Content $log, "$log.err" -ErrorAction SilentlyContinue
              throw "App exited prematurely with code $($proc.ExitCode)"
            }
            Stop-Process -Id $proc.Id -Force
          } finally {
            Remove-Item Env:\SLINT_BACKEND -ErrorAction SilentlyContinue
          }

  # Linux and macOS build/test legs. The Windows presets are named by
  # architecture (x64/x86) and drive the MSVC toolchain; on these platforms the
  # `native-*` presets build with the host compiler instead (g++ on Linux,
  # clang++ on macOS).
  build-unix:
    name: ${{ matrix.os }}-${{ matrix.build_type }}
    runs-on: ${{ matrix.os }}
    needs: format
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        build_type: [debug, release]

    steps:
      - uses: actions/checkout@v4

      # Slint's winit backend links xcb/xkbcommon/fontconfig on Linux. This
      # mirrors slint-ui/slint's own Linux dependency action. xvfb is only for
      # the headless smoke run below.
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libxcb-shape0-dev libxcb-xfixes0-dev \
            libxkbcommon-dev libxkbcommon-x11-dev \
            libfontconfig-dev libwayland-dev \
            libudev-dev libgbm-dev \
            xvfb

      # The macOS images do not guarantee Ninja, which the presets require.
      - name: Install Ninja (macOS)
        if: runner.os == 'macOS'
        run: brew install ninja

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Cache dependencies (Slint source + cargo)
        uses: actions/cache@v4
        with:
          path: |
            .deps-cache
            ~/.cargo/registry
            ~/.cargo/git
          # Per-OS key: the Slint binaries are not portable across platforms.
          key: slint-${{ matrix.os }}-${{ hashFiles('CMake/FetchSlint.cmake') }}-${{ github.sha }}
          restore-keys: |
            slint-${{ matrix.os }}-${{ hashFiles('CMake/FetchSlint.cmake') }}-
            slint-${{ matrix.os }}-

      - name: Configure
        run: cmake --preset native-${{ matrix.build_type }}

      - name: Build
        run: cmake --build --preset native-${{ matrix.build_type }} --parallel

      - name: Test
        run: ctest --preset native-${{ matrix.build_type }} --output-on-failure

      # No GPU on the runners: SLINT_BACKEND=winit-software uses the software
      # renderer compiled in by default (CMake/FetchSlint.cmake). Linux runners
      # are headless, so wrap in xvfb; macOS runners have a window server and
      # run the binary directly.
      - name: Smoke run (software renderer, GPU-less runner)
        if: runner.os == 'Linux'
        run: |
          exe="build/native-${{ matrix.build_type }}/slint-boilerplate"
          SLINT_BACKEND=winit-software xvfb-run -a "$exe" &
          pid=$!
          sleep 6
          if kill -0 "$pid" 2>/dev/null; then
            echo "App stayed up for 6s - OK"
            kill "$pid" 2>/dev/null || true
          else
            echo "App exited prematurely"
            exit 1
          fi
